<!DOCTYPE html>
<html lang="ko">
<head>
    <!-- ... 기존 코드 동일 ... -->
</head>
<body>
    <!-- ... 기존 코드 동일 ... -->
    
    <script>
        const total = 159;
        const grid = document.getElementById('grid');
        const storageKey = 'collected_1season_2022'; 

        const urlParams = new URLSearchParams(window.location.search);
        const codeParam = urlParams.get('code');
        
        let collected = [];
        if (codeParam) {
            collected = codeParam.split(',').map(Number).filter(n => n > 0 && n <= total);
        } else {
            collected = JSON.parse(localStorage.getItem(storageKey)) || [];
        }

        for (let i = 1; i <= total; i++) {
            const card = document.createElement('div');
            card.className = 'sticker-card';
            card.setAttribute('data-id', i);
            if (collected.includes(i)) card.classList.add('collected');

            // ❌ 이전 코드: 폴더 분기
            // let folderNum = i <= 100 ? "1" : "2";
            // const img = document.createElement('img');
            // img.src = `../image/2022_1season/${folderNum}/${i}.png`;

            // ✅ 수정된 코드: 폴더 분기 제거
            const img = document.createElement('img');
            img.src = `../image/2022_1season/${i}.png`;
            img.alt = `스티커 ${i}`;
            img.crossOrigin = "anonymous";

            card.appendChild(img);
            
            card.onclick = () => {
                card.classList.toggle('collected');
                updateStorage(i);
                updateURL();
            };

            grid.appendChild(card);
        }

        function updateStorage(id) {
            const index = collected.indexOf(id);
            if (index > -1) {
                collected.splice(index, 1);
            } else {
                collected.push(id);
            }
            localStorage.setItem(storageKey, JSON.stringify(collected));
        }

        function updateURL() {
            if (collected.length > 0) {
                const sortedCollected = [...collected].sort((a, b) => a - b);
                const newUrl = `${window.location.protocol}//${window.location.host}${window.location.pathname}?code=${sortedCollected.join(',')}`;
                window.history.replaceState({ path: newUrl }, '', newUrl);
            } else {
                const cleanUrl = `${window.location.protocol}//${window.location.host}${window.location.pathname}`;
                window.history.replaceState({ path: cleanUrl }, '', cleanUrl);
            }
        }

        function copyShareLink() {
            updateURL();
            navigator.clipboard.writeText(window.location.href).then(() => {
                alert('1세대 도감 수집 현황이 담긴 공유 링크가 복사되었습니다!');
            }).catch(err => {
                alert('링크 복사에 실패했습니다. 주소창의 주소를 직접 복사해주세요.');
            });
        }

        function downloadDoc() {
            const target = document.getElementById('capture-area');
            html2canvas(target, {
                useCORS: true,
                allowTaint: true,
                backgroundColor: "#1a1a1a",
                scale: 2
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = '내_2022_1세대_도감.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        if (!codeParam && collected.length > 0) {
            updateURL();
        }

        function runBackgroundCounter() {
            const firebaseBaseUrl = "https://pokedoc-f09af-default-rtdb.asia-southeast1.firebasedatabase.app";
            const apiEndpoint = `${firebaseBaseUrl}/visits.json`;

            fetch(apiEndpoint)
                .then(res => res.json())
                .then(currentValue => {
                    const newValue = currentValue ? Number(currentValue) + 1 : 1;
                    fetch(apiEndpoint, { method: 'PUT', body: JSON.stringify(newValue) });
                })
                .catch(err => console.log('Tracker active'));
        }
        window.addEventListener('DOMContentLoaded', runBackgroundCounter);
    </script>
</body>
</html>
