<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>30주년 아트윅 스페셜 띠부실 도감</title>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        :root { --bg-color: #1a1a1a; --text-color: #ffffff; --accent: #facc15; --sub-accent: #3b82f6; }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: 'Apple SD Gothic Neo', sans-serif; padding: 40px; text-align: center; }
        
        /* 캡처 구역 설정 */
        #capture-area {
            background-color: #1a1a1a;
            padding: 30px;
            border-radius: 15px;
            display: inline-block;
            width: 100%;
            max-width: 1400px; /* 12칸 배치를 위해 가로폭 확장 */
        }

        h1 { font-size: 3rem; margin-bottom: 10px; color: var(--accent); text-shadow: 0 0 10px rgba(250, 204, 21, 0.2); }
        .release-date { font-size: 1.2rem; color: #aaa; margin-bottom: 40px; }

        /* 버튼 컨테이너 및 스타일 */
        .btn-container { margin-bottom: 30px; display: flex; justify-content: center; gap: 15px; }
        .btn {
            color: white; border: none; padding: 12px 25px; font-size: 1.1rem;
            font-weight: bold; border-radius: 25px; cursor: pointer; transition: 0.2s;
        }
        .download-btn {
            background-color: var(--accent);
            color: #1a1a1a; /* 노란색 배경에 잘 보이도록 검은 글씨 */
            box-shadow: 0 4px 15px rgba(250, 204, 21, 0.3);
        }
        .download-btn:hover { transform: scale(1.05); background-color: #eab308; }
        
        .share-btn {
            background-color: var(--sub-accent);
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }
        .share-btn:hover { transform: scale(1.05); background-color: #2563eb; }

        /* [★요청] 12칸 그리드 설정 */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 12px;
            max-width: 1350px;
            margin: 0 auto;
        }

        /* 캡처 신뢰성을 위해 투명도 중심 설계 */
        .sticker-card {
            background: #2a2a2a; border-radius: 8px; padding: 6px;
            cursor: pointer; transition: 0.2s;
            opacity: 0.2; /* 100종 대형 도감 특성상 미수집은 더 흐리게 하여 가독성 확보 */
        }

        .sticker-card img {
            width: 100%; height: auto;
            transition: 0.2s;
            display: block;
        }

        /* 수집 완료(클릭됨) 상태 스타일 */
        .sticker-card.collected {
            background: #3e3e3e; 
            opacity: 1 !important; /* 캡처 시에도 투명도 100% 강제 보장 */
            box-shadow: 0 0 12px rgba(250, 204, 21, 0.3);
            border: 1px solid var(--accent);
        }
    </style>
</head>
<body>

    <div class="btn-container">
        <button class="btn download-btn" onclick="downloadDoc()">내 도감 이미지로 저장</button>
        <button class="btn share-btn" onclick="copyShareLink()">현재 도감 링크 복사</button>
    </div>

    <div id="capture-area">
        <h1>30주년 아트윅 스페셜 띠부실 도감 (100종)</h1>
        <p class="release-date">2026년 05월 07일 출시</p>

        <div class="grid-container" id="grid"></div>
    </div>

    <script>
        const total = 100; // 100종 설정
        const grid = document.getElementById('grid');
        const storageKey = 'collected_art_30y'; // 30주년 전용 저장 키

        const urlParams = new URLSearchParams(window.location.search);
        const codeParam = urlParams.get('code');
        
        let collected = [];
        if (codeParam) {
            collected = codeParam.split(',').map(Number).filter(n => n > 0 && n <= total);
        } else {
            collected = JSON.parse(localStorage.getItem(storageKey)) || [];
        }

        // 도감 그리드 생성 (1부터 100까지)
        for (let i = 1; i <= total; i++) {
            const card = document.createElement('div');
            card.className = 'sticker-card';
            card.setAttribute('data-id', i);
            if (collected.includes(i)) card.classList.add('collected');

            const img = document.createElement('img');
            // 요청하신 경로: image/30y_art/ 폴더 안의 이미지 호출
            img.src = `../image/30y_art/${i}.png`;
            img.alt = `스티커 ${i}`;
            img.crossOrigin = "anonymous"; 

            card.appendChild(img);
            
            card.onclick = () => {
                card.classList.toggle('collected');
                updateStorage(i);
                updateURL();
            };

            grid.appendChild(card);
        }

        function updateStorage(id) {
            const index = collected.indexOf(id);
            if (index > -1) {
                collected.splice(index, 1);
            } else {
                collected.push(id);
            }
            localStorage.setItem(storageKey, JSON.stringify(collected));
        }

        function updateURL() {
            if (collected.length > 0) {
                const sortedCollected = [...collected].sort((a, b) => a - b);
                const newUrl = `${window.location.protocol}//${window.location.host}${window.location.pathname}?code=${sortedCollected.join(',')}`;
                window.history.replaceState({ path: newUrl }, '', newUrl);
            } else {
                const cleanUrl = `${window.location.protocol}//${window.location.host}${window.location.pathname}`;
                window.history.replaceState({ path: cleanUrl }, '', cleanUrl);
            }
        }

        function copyShareLink() {
            updateURL();
            navigator.clipboard.writeText(window.location.href).then(() => {
                alert('30주년 도감 수집 현황이 담긴 공유 링크가 복사되었습니다!');
            }).catch(err => {
                alert('링크 복사에 실패했습니다. 주소창의 주소를 직접 복사해주세요.');
            });
        }

        function downloadDoc() {
            const target = document.getElementById('capture-area');
            
            html2canvas(target, {
                useCORS: true,
                allowTaint: true,
                backgroundColor: "#1a1a1a",
                scale: 2
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = '내_30주년_아트윅_도감.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        if (!codeParam && collected.length > 0) {
            updateURL();
        }
    </script>
</body>
</html>
