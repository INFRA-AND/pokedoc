<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>2022년 할로윈 띠부실 도감</title>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        :root { --bg-color: #1a1a1a; --text-color: #ffffff; --accent: #ff7518; }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: 'Apple SD Gothic Neo', sans-serif; padding: 40px; text-align: center; }
        
        /* 캡처 구역 설정 */
        #capture-area {
            background-color: var(--bg-color);
            padding: 20px;
            border-radius: 15px;
            display: inline-block;
            width: 100%;
            max-width: 1040px;
        }

        h1 { font-size: 3rem; margin-bottom: 10px; color: var(--accent); }
        .release-date { font-size: 1.2rem; color: #aaa; margin-bottom: 40px; }

        /* 이미지 다운로드 버튼 스타일 */
        .download-btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            margin-bottom: 30px;
            transition: 0.2s;
            box-shadow: 0 4px 15px rgba(255, 117, 24, 0.4);
        }
        .download-btn:hover {
            transform: scale(1.05);
            background-color: #e06413;
        }

        /* 6칸 그리드 설정 */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .sticker-card {
            background: #2a2a2a; border-radius: 10px; padding: 10px;
            cursor: pointer; transition: 0.3s;
        }

        .sticker-card img {
            width: 100%; height: auto;
            filter: grayscale(1) opacity(0.3); /* 기본 흑백 및 투명도 */
            transition: 0.3s;
        }

        /* 클릭 시 'collected' 클래스가 붙으면 색상 복구 */
        .sticker-card.collected img {
            filter: grayscale(0) opacity(1);
        }
    </style>
</head>
<body>

    <button class="download-btn" onclick="downloadDoc()">내 도감 이미지로 저장하기</button>

    <div id="capture-area">
        <h1>2022년 할로윈 띠부실 도감 (27종)</h1>
        <p class="release-date">2022년 09월 29일 출시</p>

        <div class="grid-container" id="grid"></div>
    </div>

    <script>
        const total = 27;
        const grid = document.getElementById('grid');
        const storageKey = 'collected_halloween_2022';

        // 로컬 스토리지에서 저장된 데이터 불러오기
        let collected = JSON.parse(localStorage.getItem(storageKey)) || [];

        for (let i = 1; i <= total; i++) {
            const card = document.createElement('div');
            card.className = 'sticker-card';
            if (collected.includes(i)) card.classList.add('collected');

            const img = document.createElement('img');
            img.src = `../image/2022_Halloween/${i}.png`;
            img.alt = `스티커 ${i}`;
            
            // ⚠️ 중요: html2canvas가 다른 폴더의 이미지를 잘 읽어오도록 설정
            img.crossOrigin = "Anonymous"; 

            card.appendChild(img);
            
            card.onclick = () => {
                card.classList.toggle('collected');
                updateStorage(i);
            };

            grid.appendChild(card);
        }

        function updateStorage(id) {
            const index = collected.indexOf(id);
            if (index > -1) {
                collected.splice(index, 1);
            } else {
                collected.push(id);
            }
            localStorage.setItem(storageKey, JSON.stringify(collected));
        }

        // 이미지 다운로드 기능 함수
        function downloadDoc() {
            const target = document.getElementById('capture-area');
            
            // 버튼을 누른 시점의 화면 상태 그대로 캡처 시작
            html2canvas(target, {
                useCORS: true, // 외부 이미지나 다른 경로 이미지 허용
                backgroundColor: "#1a1a1a", // 배경색 강제 지정 (주변이 투명해지는 것 방지)
                scale: 2 // 화질을 2배로 깨끗하게 저장
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = '내_2022_할로윈_도감.png'; // 다운로드될 파일명
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }
    </script>
</body>
</html>
