<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>2026 NEW 시즌5 띠부실 도감</title>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        :root { --bg-color: #111827; --text-color: #ffffff; --accent: #f472b6; --sub-accent: #3b82f6; }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: 'Apple SD Gothic Neo', sans-serif; padding: 40px 15px; text-align: center; margin: 0; -webkit-text-size-adjust: none; }
        #capture-area { background-color: var(--bg-color); padding: 30px 15px; border-radius: 15px; display: inline-block; width: 100%; max-width: 1040px; box-sizing: border-box; }
        h1 { font-size: 2.2rem; margin-bottom: 10px; color: var(--accent); text-shadow: 0 0 10px rgba(244,114,182,0.2); word-break: keep-all; }
        #progress-container { margin-bottom: 25px; font-size: 1.3rem; font-weight: bold; color: var(--accent); }
        .release-date { font-size: 1.1rem; color: #9ca3af; margin-bottom: 15px; }
        .info-note { font-size: 0.95rem; color: #e5e7eb; margin-bottom: 40px; font-weight: 500; letter-spacing: 0.5px; word-break: keep-all; }
        .btn-container { margin: 0 auto 30px auto; display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 1040px; gap: 15px; flex-wrap: wrap; }
        .btn { color: white; border: none; padding: 12px 22px; font-size: 1rem; font-weight: bold; border-radius: 25px; cursor: pointer; transition: 0.2s; white-space: nowrap; }
        .home-btn { background-color: #475569; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .home-btn:hover { transform: scale(1.05); background-color: #334155; }
        .download-btn { background-color: var(--accent); color: #111827; box-shadow: 0 4px 15px rgba(244,114,182,0.3); }
        .download-btn:hover { transform: scale(1.05); background-color: #ec4899; color: white; }
        .share-btn { background-color: var(--sub-accent); box-shadow: 0 4px 15px rgba(59,130,246,0.4); }
        .share-btn:hover { transform: scale(1.05); background-color: #2563eb; }
        /* 👇 초기화 버튼 스타일 추가 */
        .reset-btn { background-color: #ef4444; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4); }
        .reset-btn:hover { transform: scale(1.05); background-color: #dc2626; }

        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 15px; max-width: 1000px; margin: 0 auto; }
        .sticker-card { background: #ffffff; border: 1px solid #111111; border-radius: 8px; padding: 8px; cursor: pointer; transition: 0.3s; aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center; box-sizing: border-box; }
        .sticker-card img { width: 100%; height: 100%; object-fit: contain; transition: 0.3s; display: block; opacity: 0.25; }
        .sticker-card.collected { box-shadow: 0 0 15px rgba(244,114,182,0.4); border: 2px solid var(--accent); }
        .sticker-card.collected img { opacity: 1 !important; }
        @media (max-width: 640px) {
            body { padding: 20px 10px; }
            h1 { font-size: 1.5rem; }
            .btn-container { justify-content: center; flex-direction: column; width: 100%; }
            .btn-container a, .btn-container div { width: 100%; display: flex; gap: 10px; }
            .btn { flex: 1; font-size: 0.9rem; padding: 10px 15px; text-align: center; justify-content: center; }
            .grid-container { grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 10px; }
            .sticker-card { height: 105px; padding: 6px; }
            #capture-area { padding: 20px 10px; }
        }
    </style>
</head>
<body>
    <div class="btn-container">
        <a href="../index.html" style="text-decoration: none;"><button class="btn home-btn">🏠 메인 목록으로</button></a>
        <div style="display: flex; gap: 10px; flex: 1; justify-content: flex-end; flex-wrap: wrap;">
            <button class="btn download-btn" onclick="downloadDoc()">내 도감 이미지로 저장</button>
            <button class="btn share-btn" onclick="copyShareLink()">현재 도감 링크 복사</button>
            <button class="btn reset-btn" onclick="resetProgress()">🔄 초기화</button>
        </div>
    </div>
    <div id="capture-area">
        <h1>2026 NEW 시즌5 띠부실 도감 (150종)</h1>
        <div id="progress-container">수집 현황: <span id="progress-text">0 / 150 (0%)</span></div>
        <p class="release-date">2026년 03월 30일 출시</p>
        <p class="info-note">💡 2026년 3월 30일 출시 NEW 시즌5 150종 (30주년 기념)</p>
        <div class="grid-container" id="grid"></div>
        <div style="text-align: right; margin-top: 40px; padding-right: 10px; font-size: 0.9rem; color: #4b5563; letter-spacing: 2px;">
            CREATED BY <strong style="color: var(--accent); text-shadow: 0 0 5px rgba(244,114,182,0.3);">AND</strong>
        </div>
    </div>
    <script>
        const total = 150;
        const grid = document.getElementById('grid');
        const progressText = document.getElementById('progress-text');
        // 👇 index.html에 등록해야 할 키값입니다.
        const storageKey = 'collected_new_season5_2026';

        const urlParams = new URLSearchParams(window.location.search);
        const codeParam = urlParams.get('code');

        let collected = [];
        if (codeParam) {
            collected = codeParam.split(',').map(Number).filter(n => n > 0 && n <= total);
        } else {
            collected = JSON.parse(localStorage.getItem(storageKey)) || [];
        }

        function updateProgress() {
            const current = collected.length;
            const percent = ((current / total) * 100).toFixed(1);
            progressText.innerText = `${current} / ${total} (${percent}%)`;
        }

        for (let i = 1; i <= total; i++) {
            const card = document.createElement('div');
            card.className = 'sticker-card';
            card.setAttribute('data-id', i);
            if (collected.includes(i)) card.classList.add('collected');

            const img = document.createElement('img');
            img.src = `../image/2026_new_season5/${i <= 100 ? "1" : "2"}/${i}.png`;
            img.alt = `스티커 ${i}`;
            img.crossOrigin = "anonymous";
            card.appendChild(img);

            card.addEventListener('click', () => {
                const index = collected.indexOf(i);
                if (index > -1) {
                    collected.splice(index, 1);
                    card.classList.remove('collected');
                } else {
                    collected.push(i);
                    card.classList.add('collected');
                }
                localStorage.setItem(storageKey, JSON.stringify(collected));
                updateURL();
                updateProgress();
            });

            grid.appendChild(card);
        }

        function updateURL() {
            const sorted = [...collected].sort((a, b) => a - b);
            const newUrl = sorted.length > 0
                ? `${location.protocol}//${location.host}${location.pathname}?code=${sorted.join(',')}`
                : `${location.protocol}//${location.host}${location.pathname}`;
            window.history.replaceState({ path: newUrl }, '', newUrl);
        }

        function copyShareLink() {
            updateURL();
            navigator.clipboard.writeText(window.location.href).then(() => {
                alert('2026 NEW 시즌5 도감 수집 현황이 담긴 공유 링크가 복사되었습니다!');
            }).catch(() => alert('링크 복사에 실패했습니다. 주소창의 주소를 직접 복사해주세요.'));
        }

        function downloadDoc() {
            const target = document.getElementById('capture-area');
            target.style.width = '1040px';
            target.style.minWidth = '1040px';
            html2canvas(target, {
                useCORS: true,
                allowTaint: true,
                backgroundColor: "#111827",
                scale: 2,
                windowWidth: 1200
            }).then(canvas => {
                target.style.width = '';
                target.style.minWidth = '';
                const link = document.createElement('a');
                link.download = '내_2026_NEW_시즌5_도감.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        // 👇 새롭게 추가된 초기화 함수
        function resetProgress() {
            if(confirm("정말로 수집 내역을 초기화하시겠습니까? (이 작업은 되돌릴 수 없습니다)")) {
                collected = []; 
                localStorage.removeItem(storageKey); 
                
                document.querySelectorAll('.sticker-card').forEach(card => {
                    card.classList.remove('collected');
                });
                
                updateProgress();
                updateURL();
                alert("초기화되었습니다.");
            }
        }

        updateProgress();
        if (!codeParam && collected.length > 0) updateURL();

        function runBackgroundCounter() {
            const apiEndpoint = "https://pokedoc-f09af-default-rtdb.asia-southeast1.firebasedatabase.app/visits.json";
            fetch(apiEndpoint).then(res => res.json()).then(v => {
                fetch(apiEndpoint, { method: 'PUT', body: JSON.stringify(v ? Number(v) + 1 : 1) });
            }).catch(() => {});
        }
        window.addEventListener('DOMContentLoaded', runBackgroundCounter);
    </script>
</body>
</html>
