<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>2023 NEW 시즌1 띠부실 도감</title>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        :root { --bg-color: #1a1a1a; --text-color: #ffffff; --accent: #6366f1; --sub-accent: #3b82f6; }
        body { 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            font-family: 'Apple SD Gothic Neo', sans-serif; 
            padding: 40px 15px; 
            text-align: center; 
            margin: 0;
            -webkit-text-size-adjust: none; 
        }
        
        #capture-area {
            background-color: #1a1a1a;
            padding: 30px 15px;
            border-radius: 15px;
            display: inline-block;
            width: 100%;
            max-width: 1040px;
            box-sizing: border-box;
        }

        h1 { 
            font-size: 2.2rem; 
            margin-bottom: 10px; 
            color: var(--accent); 
            text-shadow: 0 0 10px rgba(99, 102, 241, 0.2); 
            word-break: keep-all;
        }

        /* 👇 진행률 표시 스타일 추가 */
        #progress-container { margin-bottom: 25px; font-size: 1.3rem; font-weight: bold; color: var(--accent); }

        .release-date { font-size: 1.1rem; color: #aaa; margin-bottom: 15px; }
        .info-note { font-size: 0.95rem; color: #94a3b8; margin-bottom: 40px; font-weight: 500; letter-spacing: 0.5px; word-break: keep-all; }

        .btn-container { 
            margin: 0 auto 30px auto; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            width: 100%;
            max-width: 1040px; 
            gap: 15px;
            flex-wrap: wrap; 
        }
        .btn {
            color: white; border: none; padding: 12px 22px; font-size: 1rem;
            font-weight: bold; border-radius: 25px; cursor: pointer; transition: 0.2s;
            white-space: nowrap; 
        }
        
        .home-btn { background-color: #475569; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3); }
        .home-btn:hover { transform: scale(1.05); background-color: #334155; }

        .download-btn { background-color: var(--accent); color: white; box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4); }
        .download-btn:hover { transform: scale(1.05); background-color: #4f46e5; }
        
        .share-btn { background-color: var(--sub-accent); box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4); }
        .share-btn:hover { transform: scale(1.05); background-color: #2563eb; }

        /* 👇 초기화 버튼 스타일 추가 */
        .reset-btn { background-color: #ef4444; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4); }
        .reset-btn:hover { transform: scale(1.05); background-color: #dc2626; }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); 
            gap: 15px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .sticker-card {
            background: #2a2a2a; border-radius: 10px; padding: 10px;
            cursor: pointer; transition: 0.3s;
            opacity: 0.25;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sticker-card img {
            width: 100%; height: auto;
            transition: 0.3s;
            display: block;
            object-fit: contain;
        }

        .sticker-card.collected {
            background: #3a3a3a;
            opacity: 1 !important;
            box-shadow: 0 0 12px rgba(99, 102, 241, 0.3);
            border: 1px solid var(--accent);
        }

        @media (max-width: 640px) {
            body { padding: 20px 10px; }
            h1 { font-size: 1.6rem; }
            .btn-container { justify-content: center; flex-direction: column; width: 100%; }
            .btn-container a, .btn-container div { width: 100%; display: flex; gap: 10px; }
            .btn { flex: 1; font-size: 0.9rem; padding: 10px 15px; text-align: center; justify-content: center; }
            .grid-container { grid-template-columns: repeat(auto-fill, minmax(95px, 1fr)); gap: 10px; } 
            #capture-area { padding: 20px 10px; }
        }
    </style>
</head>
<body>

    <div class="btn-container">
        <a href="../index.html" style="text-decoration: none;">
            <button class="btn home-btn">🏠 메인 목록으로</button>
        </a>
        <div style="display: flex; gap: 10px; flex: 1; justify-content: flex-end; flex-wrap: wrap;">
            <button class="btn download-btn" onclick="downloadDoc()">내 도감 이미지로 저장</button>
            <button class="btn share-btn" onclick="copyShareLink()">현재 도감 링크 복사</button>
            <button class="btn reset-btn" onclick="resetProgress()">🔄 초기화</button>
        </div>
    </div>

    <div id="capture-area">
        <h1>2023 NEW 시즌1 띠부실 도감 (139종)</h1>
        
        <div id="progress-container">수집 현황: <span id="progress-text">0 / 139 (0%)</span></div>

        <p class="release-date">2023년 10월 30일 개편 출시</p>
        <p class="info-note">💡 2023 5월 출시 55종 + 뮤 + 뮤츠 + NEW시즌1 139종 = 198종으로 개편</p>

        <div class="grid-container" id="grid"></div>

        <div style="text-align: right; margin-top: 40px; padding-right: 10px; font-size: 0.9rem; color: #555; letter-spacing: 2px;">
            CREATED BY <strong style="color: var(--accent); text-shadow: 0 0 5px rgba(99, 102, 241, 0.3);">AND</strong>
        </div>
    </div>

    <script>
        const total = 139;
        const grid = document.getElementById('grid');
        const progressText = document.getElementById('progress-text'); // 👇 추가
        // 👇 index.html에 등록해야 할 키값입니다.
        const storageKey = 'collected_new_1season_2023';

        const urlParams = new URLSearchParams(window.location.search);
        const codeParam = urlParams.get('code');
        
        let collected = [];
        if (codeParam) {
            collected = codeParam.split(',').map(Number).filter(n => n > 0 && n <= total);
        } else {
            collected = JSON.parse(localStorage.getItem(storageKey)) || [];
        }

        // 👇 진행률 업데이트 함수
        function updateProgress() {
            const current = collected.length;
            const percent = ((current / total) * 100).toFixed(1);
            progressText.innerText = `${current} / ${total} (${percent}%)`;
        }

        for (let i = 1; i <= total; i++) {
            const card = document.createElement('div');
            card.className = 'sticker-card';
            card.setAttribute('data-id', i);
            if (collected.includes(i)) card.classList.add('collected');

            let folderNum = i <= 100 ? "1" : "2";

            const img = document.createElement('img');
            img.src = `../image/2023_new_1season/${folderNum}/${i}.png`;
            img.alt = `스티커 ${i}`;
            img.crossOrigin = "anonymous";

            card.appendChild(img);
            
            card.onclick = () => {
                card.classList.toggle('collected');
                updateStorage(i);
                updateURL();
                updateProgress(); // 👇 클릭 시 진행률 갱신 추가
            };

            grid.appendChild(card);
        }

        function updateStorage(id) {
            const index = collected.indexOf(id);
            if (index > -1) {
                collected.splice(index, 1);
            } else {
                collected.push(id);
            }
            localStorage.setItem(storageKey, JSON.stringify(collected));
        }

        function updateURL() {
            if (collected.length > 0) {
                const sortedCollected = [...collected].sort((a, b) => a - b);
                const newUrl = `${window.location.protocol}//${window.location.host}${window.location.pathname}?code=${sortedCollected.join(',')}`;
                window.history.replaceState({ path: newUrl }, '', newUrl);
            } else {
                const cleanUrl = `${window.location.protocol}//${window.location.host}${window.location.pathname}`;
                window.history.replaceState({ path: cleanUrl }, '', cleanUrl);
            }
        }

        function copyShareLink() {
            updateURL();
            navigator.clipboard.writeText(window.location.href).then(() => {
                alert('2023 NEW 시즌1 도감 수집 현황이 담긴 공유 링크가 복사되었습니다!');
            }).catch(err => {
                alert('링크 복사에 실패했습니다. 주소창의 주소를 직접 복사해주세요.');
            });
        }

        function downloadDoc() {
            const target = document.getElementById('capture-area');
            html2canvas(target, {
                useCORS: true,
                allowTaint: true,
                backgroundColor: "#1a1a1a",
                scale: 2
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = '내_2023_NEW_시즌1_도감.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        // 👇 새롭게 추가된 초기화 함수
        function resetProgress() {
            if(confirm("정말로 수집 내역을 초기화하시겠습니까? (이 작업은 되돌릴 수 없습니다)")) {
                collected = []; 
                localStorage.removeItem(storageKey); 
                
                document.querySelectorAll('.sticker-card').forEach(card => {
                    card.classList.remove('collected');
                });
                
                updateProgress();
                updateURL();
                alert("초기화되었습니다.");
            }
        }

        // 👇 페이지 로드 시 진행률 초기 세팅
        updateProgress();

        if (!codeParam && collected.length > 0) {
            updateURL();
        }

        function runBackgroundCounter() {
            const firebaseBaseUrl = "https://pokedoc-f09af-default-rtdb.asia-southeast1.firebasedatabase.app";
            const apiEndpoint = `${firebaseBaseUrl}/visits.json`;

            fetch(apiEndpoint)
                .then(res => res.json())
                .then(currentValue => {
                    const newValue = currentValue ? Number(currentValue) + 1 : 1;
                    fetch(apiEndpoint, { method: 'PUT', body: JSON.stringify(newValue) });
                })
                .catch(err => console.log('Tracker active'));
        }
        window.addEventListener('DOMContentLoaded', runBackgroundCounter);
    </script>
</body>
</html>
