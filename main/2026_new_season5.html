<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>2026 NEW 시즌5 띠부실 도감</title>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        :root { 
            --bg-color: #111827; 
            --text-color: #ffffff; 
            --accent: #f472b6;       /* 시즌5 시그니처 테마: 화사한 블라썸 핑크 */
            --sub-accent: #3b82f6; 
        }
        body { 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            font-family: 'Apple SD Gothic Neo', sans-serif; 
            padding: 40px; 
            text-align: center; 
        }
        
        /* 캡처 구역 설정 */
        #capture-area {
            background-color: var(--bg-color);
            padding: 30px;
            border-radius: 15px;
            display: inline-block;
            width: 100%;
            max-width: 1040px;
        }

        h1 { font-size: 3rem; margin-bottom: 10px; color: var(--accent); text-shadow: 0 0 10px rgba(244, 114, 182, 0.2); }
        .release-date { font-size: 1.2rem; color: #9ca3af; margin-bottom: 15px; }
        
        /* 특징 안내 문구 스타일 (요청 문구 완벽 반영) */
        .info-note { font-size: 0.95rem; color: #e5e7eb; margin-bottom: 40px; font-weight: 500; letter-spacing: 0.5px; }

        /* 버튼들을 좌우 양끝으로 정렬하는 컨테이너 */
        .btn-container { 
            margin: 0 auto 30px auto; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            width: 100%;
            max-width: 1040px; 
        }
        .btn {
            color: white; border: none; padding: 12px 25px; font-size: 1.1rem;
            font-weight: bold; border-radius: 25px; cursor: pointer; transition: 0.2s;
        }
        /* [기본 탑재 스펙] 메인 홈 이동 버튼 스타일 */
        .home-btn {
            background-color: #475569;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        .home-btn:hover { transform: scale(1.05); background-color: #334155; }

        .download-btn {
            background-color: var(--accent);
            color: #111827;
            box-shadow: 0 4px 15px rgba(244, 114, 182, 0.3);
        }
        .download-btn:hover { transform: scale(1.05); background-color: #ec4899; color: white; }
        
        .share-btn {
            background-color: var(--sub-accent);
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }
        .share-btn:hover { transform: scale(1.05); background-color: #2563eb; }

        /* 6칸 그리드 설정 */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        /* 흰색 배경 상시 보장 및 가로세로 비율 방어 기법 */
        .sticker-card {
            background: #ffffff;      /* 흰색 배경 상시 보장 */
            border: 1px solid #111111; /* 검은색 테두리 박스 규격 고정 */
            border-radius: 8px; 
            padding: 8px;
            cursor: pointer; 
            transition: 0.3s;
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sticker-card img {
            width: 100%; 
            height: 100%;
            object-fit: contain;     /* 이미지 가로/세로 찌그러짐 원천 차단 */
            transition: 0.3s;
            display: block;
            opacity: 0.25;           /* 미수집 상태: 캐릭터만 흐리게 대기 */
        }

        /* 수집 완료(클릭됨) 상태 */
        .sticker-card.collected {
            box-shadow: 0 0 15px rgba(244, 114, 182, 0.4);
            border: 2px solid var(--accent); /* 수집 시 테두리 블라썸 포인트 */
        }

        .sticker-card.collected img {
            opacity: 1 !important;   /* 수집 시 본래 캐릭터 색감 완벽 복원 */
        }
    </style>
</head>
<body>

    <div class="btn-container">
        <a href="../index.html" style="text-decoration: none;">
            <button class="btn home-btn">🏠 메인 목록으로</button>
        </a>
        <div style="display: flex; gap: 15px;">
            <button class="btn download-btn" onclick="downloadDoc()">내 도감 이미지로 저장</button>
            <button class="btn share-btn" onclick="copyShareLink()">현재 도감 링크 복사</button>
        </div>
    </div>

    <div id="capture-area">
        <h1>2026 NEW 시즌5 띠부실 도감 (150종)</h1>
        <p class="release-date">2026년 03월 30일 출시</p>
        <p class="info-note">💡 2026년 3월 30일 출시 NEW 시즌5 150종 (30주년 기념)</p>

        <div class="grid-container" id="grid"></div>

        <div style="text-align: right; margin-top: 40px; padding-right: 10px; font-size: 0.9rem; color: #4b5563; letter-spacing: 2px;">
            CREATED BY <strong style="color: var(--accent); text-shadow: 0 0 5px rgba(244, 114, 182, 0.3);">AND</strong>
        </div>
    </div>

    <script>
        const total = 150; // 총 150종 고정 설정
        const grid = document.getElementById('grid');
        const storageKey = 'collected_new_season5_2026'; // 시즌5 전용 고유 로컬스토리지 열쇠

        const urlParams = new URLSearchParams(window.location.search);
        const codeParam = urlParams.get('code');
        
        let collected = [];
        if (codeParam) {
            collected = codeParam.split(',').map(Number).filter(n => n > 0 && n <= total);
        } else {
            collected = JSON.parse(localStorage.getItem(storageKey)) || [];
        }

        // 도감 그리드 자동 빌드 및 100개 단위 분기 처리 모듈 작동
        for (let i = 1; i <= total; i++) {
            const card = document.createElement('div');
            card.className = 'sticker-card';
            card.setAttribute('data-id', i);
            if (collected.includes(i)) card.classList.add('collected');

            // [폴더 분기 규칙] 1~100번은 "1" 폴더, 101~150번은 "2" 폴더 자동 매핑
            let folderNum = i <= 100 ? "1" : "2";

            const img = document.createElement('img');
            // 요청 조건 동기화 (png 확장자 및 지정 경로 트리 구조 적용)
            img.src = `../image/2026_new_season5/${folderNum}/${i}.png`;
            img.alt = `스티커 ${i}`;
            img.crossOrigin = "anonymous";

            card.appendChild(img);
            
            card.onclick = () => {
                card.classList.toggle('collected');
                updateStorage(i);
                updateURL();
            };

            grid.appendChild(card);
        }

        function updateStorage(id) {
            const index = collected.indexOf(id);
            if (index > -1) {
                collected.splice(index, 1);
            } else {
                collected.push(id);
            }
            localStorage.setItem(storageKey, JSON.stringify(collected));
        }

        function updateURL() {
            if (collected.length > 0) {
                const sortedCollected = [...collected].sort((a, b) => a - b);
                const newUrl = `${window.location.protocol}//${window.location.host}${window.location.pathname}?code=${sortedCollected.join(',')}`;
                window.history.replaceState({ path: newUrl }, '', newUrl);
            } else {
                const cleanUrl = `${window.location.protocol}//${window.location.host}${window.location.pathname}`;
                window.history.replaceState({ path: cleanUrl }, '', cleanUrl);
            }
        }

        function copyShareLink() {
            updateURL();
            navigator.clipboard.writeText(window.location.href).then(() => {
                alert('2026 NEW 시즌5 도감 수집 현황이 담긴 공유 링크가 복사되었습니다!');
            }).catch(err => {
                alert('링크 복사에 실패했습니다. 주소창의 주소를 직접 복사해주세요.');
            });
        }

        function downloadDoc() {
            const target = document.getElementById('capture-area');
            html2canvas(target, {
                useCORS: true,
                allowTaint: true,
                backgroundColor: "#111827",
                scale: 2
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = '내_2026_NEW_시즌5_도감.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        if (!codeParam && collected.length > 0) {
            updateURL();
        }

        // [기본 탑재 스펙] 파이어베이스 데이터베이스 백그라운드 카운팅 통합 트래커
        function runBackgroundCounter() {
            const firebaseBaseUrl = "https://pokedoc-f09af-default-rtdb.asia-southeast1.firebasedatabase.app";
            const apiEndpoint = `${firebaseBaseUrl}/visits.json`;

            fetch(apiEndpoint)
                .then(res => res.json())
                .then(currentValue => {
                    const newValue = currentValue ? Number(currentValue) + 1 : 1;
                    fetch(apiEndpoint, { method: 'PUT', body: JSON.stringify(newValue) });
                })
                .catch(err => console.log('Tracker active'));
        }
        window.addEventListener('DOMContentLoaded', runBackgroundCounter);
    </script>
</body>
</html>
