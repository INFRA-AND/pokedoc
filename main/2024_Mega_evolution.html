<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>2024 메가진화 띠부실 도감</title>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        :root { --bg-color: #1a1a1a; --text-color: #ffffff; --accent: #c084fc; --sub-accent: #3b82f6; }
        body { 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            font-family: 'Apple SD Gothic Neo', sans-serif; 
            padding: 40px 15px; 
            text-align: center; 
            margin: 0;
            -webkit-text-size-adjust: none;
        }
        
        #capture-area {
            background-color: #1a1a1a;
            padding: 30px 15px;
            border-radius: 15px;
            display: inline-block;
            width: 100%;
            max-width: 1040px;
            box-sizing: border-box;
        }

        h1 { font-size: 2.2rem; margin-bottom: 10px; color: var(--accent); text-shadow: 0 0 10px rgba(192, 132, 252, 0.2); word-break: keep-all; }
        
        /* 진행률 표시 스타일 */
        #progress-container { margin: 20px 0; font-size: 1.3rem; font-weight: bold; color: var(--accent); }
        
        .release-date { font-size: 1.1rem; color: #aaa; margin-bottom: 15px; }
        .info-note { font-size: 0.95rem; color: #94a3b8; margin-bottom: 40px; font-weight: 500; letter-spacing: 0.5px; }

        .btn-container { 
            margin: 0 auto 30px auto; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            width: 100%;
            max-width: 1040px; 
            gap: 15px;
            flex-wrap: wrap; 
        }
        .btn {
            color: white; border: none; padding: 12px 22px; font-size: 1rem;
            font-weight: bold; border-radius: 25px; cursor: pointer; transition: 0.2s;
            white-space: nowrap;
        }
        .home-btn { background-color: #475569; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3); }
        .download-btn { background-color: var(--accent); color: #1a1a1a; box-shadow: 0 4px 15px rgba(192, 132, 252, 0.3); }
        .share-btn { background-color: var(--sub-accent); box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4); }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); 
            gap: 15px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .sticker-card {
            background: #2a2a2a; border-radius: 10px; padding: 10px;
            cursor: pointer; transition: 0.3s;
            opacity: 0.25;
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        .sticker-card img { max-width: 100%; max-height: 100%; object-fit: contain; transition: 0.3s; display: block; }
        .sticker-card.collected { background: #3a3a3a; opacity: 1 !important; box-shadow: 0 0 12px rgba(192, 132, 252, 0.2); border: 1px solid var(--accent); }

        @media (max-width: 640px) {
            .grid-container { grid-template-columns: repeat(auto-fill, minmax(95px, 1fr)); gap: 10px; } 
            .sticker-card { height: 110px; }
        }
    </style>
</head>
<body>

    <div class="btn-container">
        <a href="../index.html" style="text-decoration: none;">
            <button class="btn home-btn">🏠 메인 목록으로</button>
        </a>
        <div style="display: flex; gap: 10px; flex: 1; justify-content: flex-end;">
            <button class="btn download-btn" onclick="downloadDoc()">내 도감 이미지로 저장</button>
            <button class="btn share-btn" onclick="copyShareLink()">현재 도감 링크 복사</button>
        </div>
    </div>

    <div id="capture-area">
        <h1>2024 메가진화 띠부실 도감 (53종)</h1>
        <div id="progress-container">수집 현황: <span id="progress-text">0 / 53 (0%)</span></div>
        <p class="release-date">2024년 05월 03일 출시</p>
        <p class="info-note">💡 한정판 BIG 사이즈 띠부씰(가로형 27개, 세로형 26개)</p>

        <div class="grid-container" id="grid"></div>

        <div style="text-align: right; margin-top: 40px; padding-right: 10px; font-size: 0.9rem; color: #555; letter-spacing: 2px;">
            CREATED BY <strong style="color: var(--accent);">AND</strong>
        </div>
    </div>

    <script>
        const total = 53; 
        const grid = document.getElementById('grid');
        const progressText = document.getElementById('progress-text');
        const storageKey = 'collected_mega_evolution_2024'; 

        const urlParams = new URLSearchParams(window.location.search);
        const codeParam = urlParams.get('code');
        
        let collected = [];
        if (codeParam) {
            collected = codeParam.split(',').map(Number).filter(n => n > 0 && n <= total);
        } else {
            collected = JSON.parse(localStorage.getItem(storageKey)) || [];
        }

        // 진행률 업데이트 함수
        function updateProgress() {
            const current = collected.length;
            const percent = ((current / total) * 100).toFixed(1);
            progressText.innerText = `${current} / ${total} (${percent}%)`;
        }

        for (let i = 1; i <= total; i++) {
            const card = document.createElement('div');
            card.className = 'sticker-card';
            card.setAttribute('data-id', i);
            if (collected.includes(i)) card.classList.add('collected');

            const img = document.createElement('img');
            img.src = `../image/2024_Mega_evolution/${i}.png`;
            img.alt = `메가진화 스티커 ${i}`;
            img.crossOrigin = "anonymous";

            card.appendChild(img);
            
            card.onclick = () => {
                card.classList.toggle('collected');
                updateStorage(i);
                updateURL();
                updateProgress(); // 클릭 시마다 갱신
            };

            grid.appendChild(card);
        }

        function updateStorage(id) {
            const index = collected.indexOf(id);
            if (index > -1) {
                collected.splice(index, 1);
            } else {
                collected.push(id);
            }
            localStorage.setItem(storageKey, JSON.stringify(collected));
        }

        function updateURL() {
            const sorted = [...collected].sort((a, b) => a - b);
            const newUrl = sorted.length > 0 
                ? `${window.location.protocol}//${window.location.host}${window.location.pathname}?code=${sorted.join(',')}`
                : `${window.location.protocol}//${window.location.host}${window.location.pathname}`;
            window.history.replaceState({ path: newUrl }, '', newUrl);
        }

        function copyShareLink() {
            updateURL();
            navigator.clipboard.writeText(window.location.href).then(() => {
                alert('메가진화 도감 수집 현황이 담긴 공유 링크가 복사되었습니다!');
            });
        }

        function downloadDoc() {
            html2canvas(document.getElementById('capture-area'), { useCORS: true, backgroundColor: "#1a1a1a", scale: 2 })
            .then(canvas => {
                const link = document.createElement('a');
                link.download = '내_메가진화_도감.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        // 초기 실행
        updateProgress();
        if (!codeParam && collected.length > 0) updateURL();

        function runBackgroundCounter() {
            const apiEndpoint = "https://pokedoc-f09af-default-rtdb.asia-southeast1.firebasedatabase.app/visits.json";
            fetch(apiEndpoint).then(res => res.json()).then(currentValue => {
                const newValue = currentValue ? Number(currentValue) + 1 : 1;
                fetch(apiEndpoint, { method: 'PUT', body: JSON.stringify(newValue) });
            }).catch(err => console.log('Tracker active'));
        }
        window.addEventListener('DOMContentLoaded', runBackgroundCounter);
    </script>
</body>
</html>
