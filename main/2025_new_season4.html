<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>2025 NEW 시즌4 띠부실 도감</title>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        :root { 
            --bg-color: #0f172a; 
            --text-color: #ffffff; 
            --accent: #38bdf8;       /* 시즌4 시그니처: 청량한 아이스 블루 */
            --sub-accent: #3b82f6; 
        }
        body { 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            font-family: 'Apple SD Gothic Neo', sans-serif; 
            padding: 40px; 
            text-align: center; 
        }
        
        /* 캡처 구역 설정 */
        #capture-area {
            background-color: var(--bg-color);
            padding: 30px;
            border-radius: 15px;
            display: inline-block;
            width: 100%;
            max-width: 1040px;
        }

        h1 { font-size: 3rem; margin-bottom: 10px; color: var(--accent); text-shadow: 0 0 10px rgba(56, 189, 248, 0.2); }
        .release-date { font-size: 1.2rem; color: #94a3b8; margin-bottom: 15px; }
        
        /* 특징 안내 문구 스타일 (요청하신 문구 반영) */
        .info-note { font-size: 0.95rem; color: #cbd5e1; margin-bottom: 40px; font-weight: 500; letter-spacing: 0.5px; }

        /* 버튼들을 좌우 양끝으로 정렬하는 컨테이너 */
        .btn-container { 
            margin: 0 auto 30px auto; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            width: 100%;
            max-width: 1040px; 
        }
        .btn {
            color: white; border: none; padding: 12px 25px; font-size: 1.1rem;
            font-weight: bold; border-radius: 25px; cursor: pointer; transition: 0.2s;
        }
        /* 메인 홈 버튼 스타일 */
        .home-btn {
            background-color: #475569;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        .home-btn:hover { transform: scale(1.05); background-color: #334155; }

        .download-btn {
            background-color: var(--accent);
            color: #0f172a;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
        }
        .download-btn:hover { transform: scale(1.05); background-color: #0ea5e9; color: white; }
        
        .share-btn {
            background-color: var(--sub-accent);
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }
        .share-btn:hover { transform: scale(1.05); background-color: #2563eb; }

        /* 6칸 그리드 설정 */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        /* [핵심] 상시 흰색 배경 보장 및 object-fit 비율 방어 기법 탑재 */
        .sticker-card {
            background: #ffffff; /* 흰색 배경 상시 유지 */
            border: 1px solid #111111; /* 검은색 테두리 박스 고정 */
            border-radius: 8px; 
            padding: 8px;
            cursor: pointer; 
            transition: 0.3s;
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sticker-card img {
            width: 100%; 
            height: 100%;
            object-fit: contain; /* 가로/세로 비율 찌그러짐 원천 차단 */
            transition: 0.3s;
            display: block;
            opacity: 0.25; /* 미수집 상태: 캐릭터만 흐리게 처리 */
        }

        /* 수집 완료(클릭됨) 상태 */
        .sticker-card.collected {
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
            border: 2px solid var(--accent); /* 수집 시 테두리 하이라이트 */
        }

        .sticker-card.collected img {
            opacity: 1 !important; /* 수집 시 본래 캐릭터 색감 복원 */
        }
    </style>
</head>
<body>

    <div class="btn-container">
        <a href="../index.html" style="text-decoration: none;">
            <button class="btn home-btn">🏠 메인 목록으로</button>
        </a>
        <div style="display: flex; gap: 15px;">
            <button class="btn download-btn" onclick="downloadDoc()">내 도감 이미지로 저장</button>
            <button class="btn share-btn" onclick="copyShareLink()">현재 도감 링크 복사</button>
        </div>
    </div>

    <div id="capture-area">
        <h1>2025 NEW 시즌4 띠부실 도감 (168종)</h1>
        <p class="release-date">2025년 07월 31일 출시</p>
        <p class="info-note">💡 2025년 7월 31일 출시 NEW 시즌4 168종</p>

        <div class="grid-container" id="grid"></div>

        <div style="text-align: right; margin-top: 40px; padding-right: 10px; font-size: 0.9rem; color: #475569; letter-spacing: 2px;">
            CREATED BY <strong style="color: var(--accent); text-shadow: 0 0 5px rgba(56, 189, 248, 0.3);">AND</strong>
        </div>
    </div>

    <script>
        const total = 168; // 총 168종 설정
        const grid = document.getElementById('grid');
        const storageKey = 'collected_new_season4_2025'; // 시즌4 전용 고유 로컬스토리지 키

        const urlParams = new URLSearchParams(window.location.search);
        const codeParam = urlParams.get('code');
        
        let collected = [];
        if (codeParam) {
            collected = codeParam.split(',').map(Number).filter(n => n > 0 && n <= total);
        } else {
            collected = JSON.parse(localStorage.getItem(storageKey)) || [];
        }

        // 도감 그리드 생성 (폴더 자동 분기 및 .png 확장자 처리)
        for (let i = 1; i <= total; i++) {
            const card = document.createElement('div');
            card.className = 'sticker-card';
            card.setAttribute('data-id', i);
            if (collected.includes(i)) card.classList.add('collected');

            // [자동 분기] 100개 단위 폴더 분기 처리 (1~100번은 "1", 101~168번은 "2")
            let folderNum = i <= 100 ? "1" : "2";

            const img = document.createElement('img');
            // 요청 요건(png 확장자 및 분할 경로 폴더 트리 구조) 완벽 연동
            img.src = `../image/2025_new_season4/${folderNum}/${i}.png`;
            img.alt = `스티커 ${i}`;
            img.crossOrigin = "anonymous";

            card.appendChild(img);
            
            card.onclick = () => {
                card.classList.toggle('collected');
                updateStorage(i);
                updateURL();
            };

            grid.appendChild(card);
        }

        function updateStorage(id) {
            const index = collected.indexOf(id);
            if (index > -1) {
                collected.splice(index, 1);
            } else {
                collected.push(id);
            }
            localStorage.setItem(storageKey, JSON.stringify(collected));
        }

        function updateURL() {
            if (collected.length > 0) {
                const sortedCollected = [...collected].sort((a, b) => a - b);
                const newUrl = `${window.location.protocol}//${window.location.host}${window.location.pathname}?code=${sortedCollected.join(',')}`;
                window.history.replaceState({ path: newUrl }, '', newUrl);
            } else {
                const cleanUrl = `${window.location.protocol}//${window.location.host}${window.location.pathname}`;
                window.history.replaceState({ path: cleanUrl }, '', cleanUrl);
            }
        }

        function copyShareLink() {
            updateURL();
            navigator.clipboard.writeText(window.location.href).then(() => {
                alert('2025 NEW 시즌4 도감 수집 현황이 담긴 공유 링크가 복사되었습니다!');
            }).catch(err => {
                alert('링크 복사에 실패했습니다. 주소창의 주소를 직접 복사해주세요.');
            });
        }

        function downloadDoc() {
            const target = document.getElementById('capture-area');
            html2canvas(target, {
                useCORS: true,
                allowTaint: true,
                backgroundColor: "#0f172a",
                scale: 2
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = '내_2025_NEW_시즌4_도감.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        if (!codeParam && collected.length > 0) {
            updateURL();
        }

        // [최신 표준 규격] 파이어베이스 데이터베이스 백그라운드 카운팅 연동 스택
        function runBackgroundCounter() {
            const firebaseBaseUrl = "https://pokedoc-f09af-default-rtdb.asia-southeast1.firebasedatabase.app";
            const apiEndpoint = `${firebaseBaseUrl}/visits.json`;

            fetch(apiEndpoint)
                .then(res => res.json())
                .then(currentValue => {
                    const newValue = currentValue ? Number(currentValue) + 1 : 1;
                    fetch(apiEndpoint, { method: 'PUT', body: JSON.stringify(newValue) });
                })
                .catch(err => console.log('Tracker active'));
        }
        window.addEventListener('DOMContentLoaded', runBackgroundCounter);
    </script>
</body>
</html>
