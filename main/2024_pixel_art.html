<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>2024년 픽셀아트 띠부실 도감</title>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        :root { --bg-color: #1a1a1a; --text-color: #ffffff; --accent: #38bdf8; --sub-accent: #3b82f6; }
        body { 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            font-family: 'Apple SD Gothic Neo', sans-serif; 
            padding: 40px 15px; /* 모바일 좌우 여백 확보를 위해 패딩 조정 */
            text-align: center; 
            margin: 0;
            -webkit-text-size-adjust: none; /* iOS 폰트 비정상 확대 방지 */
        }
        
        /* 캡처 구역 설정 */
        #capture-area {
            background-color: #1a1a1a;
            padding: 30px 15px;
            border-radius: 15px;
            display: inline-block;
            width: 100%;
            max-width: 1040px;
            box-sizing: border-box;
        }

        h1 { 
            font-size: 2.2rem; /* 모바일 대응 가독성 스케일 조절 */
            margin-bottom: 10px; 
            color: var(--accent); 
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.2); 
            word-break: keep-all;
        }
        .release-date { font-size: 1.1rem; color: #aaa; margin-bottom: 15px; }
        
        /* 픽셀아트 도감 설명 문구 */
        .info-note { font-size: 0.95rem; color: #94a3b8; margin-bottom: 40px; font-weight: 500; letter-spacing: 0.5px; word-break: keep-all; }

        /* 📋 버튼 정렬 컨테이너 반응형 설계 (Flex wrap 도입) */
        .btn-container { 
            margin: 0 auto 30px auto; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            width: 100%;
            max-width: 1040px; 
            gap: 15px;
            flex-wrap: wrap; /* 모바일에서 폭이 좁아지면 버튼이 아래로 자연스럽게 줄바꿈 */
        }
        .btn {
            color: white; border: none; padding: 12px 22px; font-size: 1rem;
            font-weight: bold; border-radius: 25px; cursor: pointer; transition: 0.2s;
            white-space: nowrap; /* 텍스트 줄바꿈 방지 */
        }
        /* 메인 홈 버튼 스타일 */
        .home-btn {
            background-color: #475569;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        .home-btn:hover { transform: scale(1.05); background-color: #334155; }

        .download-btn {
            background-color: var(--accent);
            color: #1a1a1a;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
            font-weight: bold;
        }
        .download-btn:hover { transform: scale(1.05); background-color: #0ea5e9; color: white; }
        
        .share-btn {
            background-color: var(--sub-accent);
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }
        .share-btn:hover { transform: scale(1.05); background-color: #2563eb; }

        /* 📱 반응형 스마트 그리드 설정 (기존 6열 고정에서 스마트 자동 배치로 변경!) */
        .grid-container {
            display: grid;
            /* 가로 너비에 맞춰 최적의 스티커 수량(최소 가로폭 130px)이 자동으로 꽉 채워지도록 설정 */
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); 
            gap: 15px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .sticker-card {
            background: #2a2a2a; border-radius: 10px; padding: 10px;
            cursor: pointer; transition: 0.3s;
            opacity: 0.25;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sticker-card img {
            width: 100%; height: auto;
            transition: 0.3s;
            display: block;
            object-fit: contain; /* 이미지 비율 깨짐 방지 */
            image-rendering: pixelated; /* 👾 픽셀아트 이미지가 모바일에서도 흐려지지 않고 선명하게 보이도록 최적화 */
        }

        .sticker-card.collected {
            background: #3a3a3a;
            opacity: 1 !important;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.2);
            border: 1px solid var(--accent);
        }

        /* 📱 스마트폰(초소형 화면) 전용 밀착 반응형 미디어 쿼리 규칙 */
        @media (max-width: 640px) {
            body { padding: 20px 10px; }
            h1 { font-size: 1.6rem; }
            .btn-container { justify-content: center; flex-direction: column; width: 100%; }
            .btn-container a, .btn-container div { width: 100%; display: flex; gap: 10px; }
            .btn { flex: 1; font-size: 0.9rem; padding: 10px 15px; text-align: center; justify-content: center; }
            /* 모바일 세로 화면에서는 한 줄에 3~4개씩 촘촘하게 크기를 자동 배정해 터치 최적화 */
            .grid-container { grid-template-columns: repeat(auto-fill, minmax(95px, 1fr)); gap: 10px; } 
            #capture-area { padding: 20px 10px; }
        }
    </style>
</head>
<body>

    <div class="btn-container">
        <a href="../index.html" style="text-decoration: none;">
            <button class="btn home-btn">🏠 메인 목록으로</button>
        </a>
        <div style="display: flex; gap: 10px; flex: 1; justify-content: flex-end;">
            <button class="btn download-btn" onclick="downloadDoc()">내 도감 이미지로 저장</button>
            <button class="btn share-btn" onclick="copyShareLink()">현재 도감 링크 복사</button>
        </div>
    </div>

    <div id="capture-area">
        <h1>2024년 픽셀아트 띠부실 도감 (151종)</h1>
        <p class="release-date">2024년 07월 25일 출시</p>
        <p class="info-note">💡 한정판 픽셀아트 띠부씰 시리즈</p>

        <div class="grid-container" id="grid"></div>

        <div style="text-align: right; margin-top: 40px; padding-right: 10px; font-size: 0.9rem; color: #555; letter-spacing: 2px;">
            CREATED BY <strong style="color: var(--accent); text-shadow: 0 0 5px rgba(56, 189, 248, 0.3);">AND</strong>
        </div>
    </div>

    <script>
        const total = 151;
        const grid = document.getElementById('grid');
        const storageKey = 'collected_pixel_art_2024'; 

        const urlParams = new URLSearchParams(window.location.search);
        const codeParam = urlParams.get('code');
        
        let collected = [];
        if (codeParam) {
            collected = codeParam.split(',').map(Number).filter(n => n > 0 && n <= total);
        } else {
            collected = JSON.parse(localStorage.getItem(storageKey)) || [];
        }

        for (let i = 1; i <= total; i++) {
            const card = document.createElement('div');
            card.className = 'sticker-card';
            card.setAttribute('data-id', i);
            if (collected.includes(i)) card.classList.add('collected');

            let folderNum = i <= 100 ? "1" : "2";

            const img = document.createElement('img');
            img.src = `../image/2024_pixel_art/${folderNum}/${i}.png`; 
            img.alt = `스티커 ${i}`;
            img.crossOrigin = "anonymous";

            card.appendChild(img);
            
            card.onclick = () => {
                card.classList.toggle('collected');
                updateStorage(i);
                updateURL();
            };

            grid.appendChild(card);
        }

        function updateStorage(id) {
            const index = collected.indexOf(id);
            if (index > -1) {
                collected.splice(index, 1);
            } else {
                collected.push(id);
            }
            localStorage.setItem(storageKey, JSON.stringify(collected));
        }

        function updateURL() {
            if (collected.length > 0) {
                const sortedCollected = [...collected].sort((a, b) => a - b);
                const newUrl = `${window.location.protocol}//${window.location.host}${window.location.pathname}?code=${sortedCollected.join(',')}`;
                window.history.replaceState({ path: newUrl }, '', newUrl);
            } else {
                const cleanUrl = `${window.location.protocol}//${window.location.host}${window.location.pathname}`;
                window.history.replaceState({ path: cleanUrl }, '', cleanUrl);
            }
        }

        function copyShareLink() {
            updateURL();
            navigator.clipboard.writeText(window.location.href).then(() => {
                alert('픽셀아트 도감 수집 현황이 담긴 공유 링크가 복사되었습니다!');
            }).catch(err => {
                alert('링크 복사에 실패했습니다. 주소창의 주소를 직접 복사해주세요.');
            });
        }

        function downloadDoc() {
            const target = document.getElementById('capture-area');
            html2canvas(target, {
                useCORS: true,
                allowTaint: true,
                backgroundColor: "#1a1a1a",
                scale: 2
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = '내_2024_픽셀아트_도감.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        if (!codeParam && collected.length > 0) {
            updateURL();
        }

        function runBackgroundCounter() {
            const firebaseBaseUrl = "https://pokedoc-f09af-default-rtdb.asia-southeast1.firebasedatabase.app";
            const apiEndpoint = `${firebaseBaseUrl}/visits.json`;

            fetch(apiEndpoint)
                .then(res => res.json())
                .then(currentValue => {
                    const newValue = currentValue ? Number(currentValue) + 1 : 1;
                    fetch(apiEndpoint, { method: 'PUT', body: JSON.stringify(newValue) });
                })
                .catch(err => console.log('Tracker active'));
        }
        window.addEventListener('DOMContentLoaded', runBackgroundCounter);
    </script>
</body>
</html>
