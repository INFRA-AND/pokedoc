<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>2023 NEW 띠부실 도감</title>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        :root { --bg-color: #1a1a1a; --text-color: #ffffff; --accent: #a78bfa; --sub-accent: #3b82f6; }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: 'Apple SD Gothic Neo', sans-serif; padding: 40px; text-align: center; }
        
        /* 캡처 구역 설정 */
        #capture-area {
            background-color: #1a1a1a;
            padding: 30px;
            border-radius: 15px;
            display: inline-block;
            width: 100%;
            max-width: 1040px;
        }

        h1 { font-size: 3rem; margin-bottom: 10px; color: var(--accent); text-shadow: 0 0 10px rgba(167, 139, 250, 0.2); }
        .release-date { font-size: 1.2rem; color: #aaa; margin-bottom: 15px; }
        
        /* 특징 안내 문구 스타일 */
        .info-note { font-size: 0.95rem; color: #94a3b8; margin-bottom: 40px; font-weight: 500; letter-spacing: 0.5px; }

        /* 버튼들을 좌우 양끝으로 정렬하는 컨테이너 */
        .btn-container { 
            margin: 0 auto 30px auto; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            width: 100%;
            max-width: 1040px; 
        }
        .btn {
            color: white; border: none; padding: 12px 25px; font-size: 1.1rem;
            font-weight: bold; border-radius: 25px; cursor: pointer; transition: 0.2s;
        }
        /* 메인 홈 버튼 스타일 */
        .home-btn {
            background-color: #475569;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        .home-btn:hover { transform: scale(1.05); background-color: #334155; }

        .download-btn {
            background-color: var(--accent);
            color: #1a1a1a;
            box-shadow: 0 4px 15px rgba(167, 139, 250, 0.3);
        }
        .download-btn:hover { transform: scale(1.05); background-color: #8b5cf6; color: white; }
        
        .share-btn {
            background-color: var(--sub-accent);
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }
        .share-btn:hover { transform: scale(1.05); background-color: #2563eb; }

        /* 6칸 그리드 설정 */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .sticker-card {
            background: #2a2a2a; border-radius: 10px; padding: 10px;
            cursor: pointer; transition: 0.3s;
            opacity: 0.25;
        }

        .sticker-card img {
            width: 100%; height: auto;
            transition: 0.3s;
            display: block;
        }

        .sticker-card.collected {
            background: #3a3a3a;
            opacity: 1 !important;
            box-shadow: 0 0 12px rgba(167, 139, 250, 0.2);
            border: 1px solid var(--accent);
        }
    </style>
</head>
<body>

    <div style="width: 1px; height: 1px; opacity: 0; overflow: hidden; margin: 0 auto;">
        <img src="https://hits.seeyoufarm.com/api/count/incr/badge.svg?url=https%3A%2F%2Finfra-and.github.io%2Fpokedoc&count_bg=%233b82f6&title_bg=%231e293b&title=VISITORS&edge_flat=false" alt="방문자수 집계" />
    </div>

    <div class="btn-container">
        <a href="../index.html" style="text-decoration: none;">
            <button class="btn home-btn">🏠 메인 목록으로</button>
        </a>
        <div style="display: flex; gap: 15px;">
            <button class="btn download-btn" onclick="downloadDoc()">내 도감 이미지로 저장</button>
            <button class="btn share-btn" onclick="copyShareLink()">현재 도감 링크 복사</button>
        </div>
    </div>

    <div id="capture-area">
        <h1>2023 NEW 띠부실 도감 (55종)</h1>
        <p class="release-date">2023년 05월 12일 출시</p>
        <p class="info-note">💡 3세대, 4세대, 9세대 일부 출시 및 띠부실 품번 4자리 변경</p>

        <div class="grid-container" id="grid"></div>

        <div style="text-align: right; margin-top: 40px; padding-right: 10px; font-size: 0.9rem; color: #555; letter-spacing: 2px;">
            CREATED BY <strong style="color: var(--accent); text-shadow: 0 0 5px rgba(167, 139, 250, 0.3);">AND</strong>
        </div>
    </div>

    <script>
        const total = 55;
        const grid = document.getElementById('grid');
        const storageKey = 'collected_new_2023';

        const urlParams = new URLSearchParams(window.location.search);
        const codeParam = urlParams.get('code');
        
        let collected = [];
        if (codeParam) {
            collected = codeParam.split(',').map(Number).filter(n => n > 0 && n <= total);
        } else {
            collected = JSON.parse(localStorage.getItem(storageKey)) || [];
        }

        // 도감 그리드 생성 (1부터 55까지)
        for (let i = 1; i <= total; i++) {
            const card = document.createElement('div');
            card.className = 'sticker-card';
            card.setAttribute('data-id', i);
            if (collected.includes(i)) card.classList.add('collected');

            const img = document.createElement('img');
            // 매핑 확인: image/2023_new/ 폴더 내부 파일 호출
            img.src = `../image/2023_new/${i}.png`;
            img.alt = `스티커 ${i}`;
            img.crossOrigin = "anonymous";

            card.appendChild(img);
            
            card.onclick = () => {
                card.classList.toggle('collected');
                updateStorage(i);
                updateURL();
            };

            grid.appendChild(card);
        }

        function updateStorage(id) {
            const index = collected.indexOf(id);
            if (index > -1) {
                collected.splice(index, 1);
            } else {
                collected.push(id);
            }
            localStorage.setItem(storageKey, JSON.stringify(collected));
        }

        function updateURL() {
            if (collected.length > 0) {
                const sortedCollected = [...collected].sort((a, b) => a - b);
                const newUrl = `${window.location.protocol}//${window.location.host}${window.location.pathname}?code=${sortedCollected.join(',')}`;
                window.history.replaceState({ path: newUrl }, '', newUrl);
            } else {
                const cleanUrl = `${window.location.protocol}//${window.location.host}${window.location.pathname}`;
                window.history.replaceState({ path: cleanUrl }, '', cleanUrl);
            }
        }

        function copyShareLink() {
            updateURL();
            navigator.clipboard.writeText(window.location.href).then(() => {
                alert('2023 NEW 도감 수집 현황이 담긴 공유 링크가 복사되었습니다!');
            }).catch(err => {
                alert('링크 복사에 실패했습니다. 주소창의 주소를 직접 복사해주세요.');
            });
        }

        function downloadDoc() {
            const target = document.getElementById('capture-area');
            html2canvas(target, {
                useCORS: true,
                allowTaint: true,
                backgroundColor: "#1a1a1a",
                scale: 2
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = '내_2023_NEW_도감.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        if (!codeParam && collected.length > 0) {
            updateURL();
        }
    </script>
</body>
</html>
