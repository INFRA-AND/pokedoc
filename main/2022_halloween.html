<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>2022년 할로윈 띠부실 도감</title>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        :root { --bg-color: #1a1a1a; --text-color: #ffffff; --accent: #ff7518; --sub-accent: #3b82f6; }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: 'Apple SD Gothic Neo', sans-serif; padding: 40px; text-align: center; }
        
        /* 캡처 구역 설정 */
        #capture-area {
            background-color: #1a1a1a;
            padding: 30px;
            border-radius: 15px;
            display: inline-block;
            width: 100%;
            max-width: 1040px;
        }

        h1 { font-size: 3rem; margin-bottom: 10px; color: var(--accent); }
        .release-date { font-size: 1.2rem; color: #aaa; margin-bottom: 40px; }

        /* 버튼 컨테이너 및 스타일 */
        .btn-container { margin-bottom: 30px; display: flex; justify-content: center; gap: 15px; }
        .btn {
            color: white; border: none; padding: 12px 25px; font-size: 1.1rem;
            font-weight: bold; border-radius: 25px; cursor: pointer; transition: 0.2s;
        }
        .download-btn {
            background-color: var(--accent);
            box-shadow: 0 4px 15px rgba(255, 117, 24, 0.4);
        }
        .download-btn:hover { transform: scale(1.05); background-color: #e06413; }
        
        .share-btn {
            background-color: var(--sub-accent);
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }
        .share-btn:hover { transform: scale(1.05); background-color: #2563eb; }

        /* 6칸 그리드 설정 */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        /* [★수정] html2canvas 호환성을 위해 필터 대신 투명도 중심 설계 */
        .sticker-card {
            background: #2a2a2a; border-radius: 10px; padding: 10px;
            cursor: pointer; transition: 0.3s;
            opacity: 0.25; /* 미수집 상태는 카드 전체를 흐리게 처리 */
        }

        .sticker-card img {
            width: 100%; height: auto;
            transition: 0.3s;
            display: block;
        }

        /* 수집 완료(클릭됨) 상태 스타일 */
        .sticker-card.collected {
            background: #3a3a3a; /* 미세하게 더 밝은 배경 */
            opacity: 1 !important; /* 캡처 시에도 투명도 100% 강제 보장 */
            box-shadow: 0 0 10px rgba(255, 117, 24, 0.2);
        }
    </style>
</head>
<body>

    <div class="btn-container">
        <button class="btn download-btn" onclick="downloadDoc()">내 도감 이미지로 저장</button>
        <button class="btn share-btn" onclick="copyShareLink()">현재 도감 링크 복사</button>
    </div>

    <div id="capture-area">
        <h1>2022년 할로윈 띠부실 도감 (27종)</h1>
        <p class="release-date">2022년 09월 29일 출시</p>

        <div class="grid-container" id="grid"></div>
    </div>

    <script>
        const total = 27;
        const grid = document.getElementById('grid');
        const storageKey = 'collected_halloween_2022';

        const urlParams = new URLSearchParams(window.location.search);
        const codeParam = urlParams.get('code');
        
        let collected = [];
        if (codeParam) {
            collected = codeParam.split(',').map(Number).filter(n => n > 0 && n <= total);
        } else {
            collected = JSON.parse(localStorage.getItem(storageKey)) || [];
        }

        // 도감 그리드 생성
        for (let i = 1; i <= total; i++) {
            const card = document.createElement('div');
            card.className = 'sticker-card';
            card.setAttribute('data-id', i);
            if (collected.includes(i)) card.classList.add('collected');

            const img = document.createElement('img');
            img.src = `../image/2022_Halloween/${i}.png`;
            img.alt = `스티커 ${i}`;
            img.crossOrigin = "anonymous"; // 캡처 시 오작동 방지 중요 보안 설정

            card.appendChild(img);
            
            card.onclick = () => {
                card.classList.toggle('collected');
                updateStorage(i);
                updateURL();
            };

            grid.appendChild(card);
        }

        function updateStorage(id) {
            const index = collected.indexOf(id);
            if (index > -1) {
                collected.splice(index, 1);
            } else {
                collected.push(id);
            }
            localStorage.setItem(storageKey, JSON.stringify(collected));
        }

        function updateURL() {
            if (collected.length > 0) {
                const sortedCollected = [...collected].sort((a, b) => a - b);
                const newUrl = `${window.location.protocol}//${window.location.host}${window.location.pathname}?code=${sortedCollected.join(',')}`;
                window.history.replaceState({ path: newUrl }, '', newUrl);
            } else {
                const cleanUrl = `${window.location.protocol}//${window.location.host}${window.location.pathname}`;
                window.history.replaceState({ path: cleanUrl }, '', cleanUrl);
            }
        }

        function copyShareLink() {
            updateURL();
            navigator.clipboard.writeText(window.location.href).then(() => {
                alert('현재 수집 현황이 담긴 공유 링크가 복사되었습니다!');
            }).catch(err => {
                alert('링크 복사에 실패했습니다. 주소창의 주소를 직접 복사해주세요.');
            });
        }

        // [★수정] 이미지 다운로드 함수 최적화
        function downloadDoc() {
            const target = document.getElementById('capture-area');
            
            // 캡처 옵션 정밀 튜닝
            html2canvas(target, {
                useCORS: true,
                allowTaint: true,
                backgroundColor: "#1a1a1a",
                scale: 2
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = '내_2022_할로윈_도감.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        if (!codeParam && collected.length > 0) {
            updateURL();
        }
    </script>
</body>
</html>
